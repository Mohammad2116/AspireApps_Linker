name: Build and Publish Docker Images

on:
  push:
    branches:
      - CI-CD/main

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # -----------------------------------------------------------------------
      # Java
      # -----------------------------------------------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------------------------------------
      # Maven Build
      # -----------------------------------------------------------------------

      - name: Build project
        run: ./mvnw clean package -DskipTests


      # -----------------------------------------------------------------------
      # Docker
      # -----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # Login to GHCR
      # -----------------------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      # -----------------------------------------------------------------------
      # Build & Push Eureka
      # -----------------------------------------------------------------------

      - name: Build and push Eureka Server
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-server
          file: ./eureka-server/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-eureka-server:latest
            ghcr.io/mohammad2116/aspireapps-linker-eureka-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # -----------------------------------------------------------------------
      # Build & Push Gateway
      # -----------------------------------------------------------------------

      - name: Build and push Gateway Server
        uses: docker/build-push-action@v6
        with:
          context: ./gateway-server
          file: ./gateway-server/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-gateway-server:latest
            ghcr.io/mohammad2116/aspireapps-linker-gateway-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # -----------------------------------------------------------------------
      # Build & Push User Service
      # -----------------------------------------------------------------------

      - name: Build and push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-user-service:latest
            ghcr.io/mohammad2116/aspireapps-linker-user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # -----------------------------------------------------------------------
      # Build & Push Links Service
      # -----------------------------------------------------------------------

      - name: Build and push Links Service
        uses: docker/build-push-action@v6
        with:
          context: ./links-service
          file: ./links-service/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-links-service:latest
            ghcr.io/mohammad2116/aspireapps-linker-links-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # -----------------------------------------------------------------------
      # Build & Push Analysis Service
      # -----------------------------------------------------------------------

      - name: Build and push Analysis Service
        uses: docker/build-push-action@v6
        with:
          context: ./analysis-service
          file: ./analysis-service/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-analysis-service:latest
            ghcr.io/mohammad2116/aspireapps-linker-analysis-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max