name: Build and Publish Docker Images - links-service

on:
  push:
    branches:
      - CI-CD/microservice/links-service

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # -----------------------------------------------------------------------
      # Java
      # -----------------------------------------------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------------------------------------
      # Maven Build
      # -----------------------------------------------------------------------

      - name: Build project
        run: ./mvnw -pl links-service -am clean package


      # -----------------------------------------------------------------------
      # Docker
      # -----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # Login to GHCR
      # -----------------------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------------------------
      # Build & Push Links Service
      # -----------------------------------------------------------------------

      - name: Build and push Links Service
        uses: docker/build-push-action@v6
        with:
          context: ./links-service
          file: ./links-service/Dockerfile
          push: true
          tags: |
            ghcr.io/mohammad2116/aspireapps-linker-links-service:latest
            ghcr.io/mohammad2116/aspireapps-linker-links-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

