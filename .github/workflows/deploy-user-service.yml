name: user-service - Deploy to Production

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Images - user-service
    types:
      - completed
    branches:
      - CI-CD/microservice/user-service

permissions:
  contents: read

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            cd /opt/aspireapps/linker

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            echo "Deploying commit:"
            echo "$IMAGE_TAG"

            echo "Pulling Docker images..."

            docker compose \
              -f docker-compose.prod.yml \
              pull user-service

            echo "Starting services..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d --no-deps user-service

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "========================================"
            echo "Deployment completed"
            echo "========================================"

            echo "Running containers:"

            docker compose \
              -f docker-compose.prod.yml \
              ps