name: Deploy to Production

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Images
    types:
      - completed
    branches:
      - CI-CD/main

permissions:
  contents: read

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # -----------------------------------------------------------------------
      # Upload production configuration
      # -----------------------------------------------------------------------

      - name: Upload production configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/aspireapps/linker/"


      # -----------------------------------------------------------------------
      # Deploy
      # -----------------------------------------------------------------------

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            cd /opt/aspireapps/linker

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            echo "Deploying commit:"
            echo "$IMAGE_TAG"

            echo "Docker Compose configuration:"
            docker compose \
              -f docker-compose.prod.yml \
              config > /dev/null

            echo "Pulling Docker images..."

            docker compose \
              -f docker-compose.prod.yml \
              pull

            echo "Starting services..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "========================================"
            echo "Deployment completed"
            echo "========================================"

            echo "Running containers:"

            docker compose \
              -f docker-compose.prod.yml \
              ps

            echo "Gateway port mapping:"

            docker port linker-gateway-server