name: Deploy to Production

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Images
    types:
      - completed
    branches:
      - CI-CD/main

permissions:
  contents: read

jobs:

  deploy:

    # Only deploy if the build workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Deploy via SSH
      # -----------------------------------------------------------------------

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            cd /opt/aspireapps/linker

            echo "Pulling latest deployment configuration..."
            git pull origin CI-CD/main

            echo "Using image tag:"
            echo "${{ github.event.workflow_run.head_sha }}"

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

            echo "Pulling Docker images..."
            sudo -E docker compose \
              -f docker-compose.prod.yml \
              pull

            echo "Starting services..."
            sudo -E docker compose \
              -f docker-compose.prod.yml \
              up -d

            echo "Removing unused Docker images..."
            sudo docker image prune -f

            echo "========================================"
            echo "Deployment completed"
            echo "========================================"

            echo "Running containers:"
            sudo docker compose \
              -f docker-compose.prod.yml \
              ps