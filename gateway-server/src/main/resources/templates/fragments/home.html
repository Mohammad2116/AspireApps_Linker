<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="homeLinker" th:fragment="home">
    <h1 style="white-space: pre">W E L C O M E - T O - A S P I R E A P P S</h1>
    <h1 style="white-space: pre"> L I N K E R </h1>
    <h5>V.1.0</h5>

    <div class="button-group">
        <button class="primary-button">Sign up</button>
        <button class="secondary-button">Log in</button>
    </div>

    <div class="link-checker">
        <input
                aria-label="Shortened URL"
                class="link-input"
                placeholder="Enter a shortened URL"
                type="text"/>
        <button class="primary-button" type="button">
            Go
        </button>
    </div>
</div>
</html>
