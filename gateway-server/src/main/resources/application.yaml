spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      routes:
        - id: anything-test
          uri: lb://gateway-service
          predicates:
            - Path=/anything

security:
  jwt:
    secretKey: "REPLACE-THIS-WITH-SECURE-AND-STRONG-256-BIT-SECRET-KEY"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  server:
    wait-time-in-ms-when-sync-empty: 0