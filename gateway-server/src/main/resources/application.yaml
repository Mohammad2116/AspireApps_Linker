spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      routes:
        - id: homepage
          uri: lb://gateway-service
          predicates:
            - Path=/ir/aspireapps/linker

        - id: gateway-server-api
          uri: lb://gateway-service
          predicates:
            - Path=/ir/aspireapps/linker/api/v1/gateway/**
        - id: gateway-server-web
          uri: lb://gateway-service
          predicates:
            - Path=/ir/aspireapps/linker/web/v1/gateway/**

        - id: user-service-api
          uri: lb://user-service
          predicates:
            - Path=/ir/aspireapps/linker/api/v1/auth/**
        - id: user-service-web
          uri: lb://user-service
          predicates:
            - Path=/ir/aspireapps/linker/web/v1/auth/**

security:
  jwt:
    secretKey: "REPLACE-THIS-WITH-SECURE-AND-STRONG-256-BIT-SECRET-KEY"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  server:
    wait-time-in-ms-when-sync-empty: 0