spring:
  application:
    name: user-service

  server:
    wait-time-in-ms-when-sync-emtpy: 0

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: none
      open-in-view: false
      show-sql: false
      properties:
        hibernate:
          format-sql: false

    sql:
      init:
        mode: always
        platform: postgres

    flyway:
      enabled: true
      location: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      %-5level
      [%X{requestId}]
      [%thread]
      %logger{36}
      -
      %msg
  level:
    ir.aspireapps: DEBUG
    feign: DEBUG

security:
  jwt:
    access-token-secret-key: ${ACCESS_TOKEN_SECURITY_KEY}
    access-token-expiration-ms: ${ACCESS_TOKEN_TTL_MS}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_TTL_MS}

app:
  security:
    cookies-security: ${COOKIE_SECURE:true}
