services:
  #///////////////////////////////////////////////////////////////////////////// POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: Linker_postgres

    environment:
      POSTGRES_USER: demoapps
      POSTGRES_PASSWORD: JingleBells

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demoapps -d linker_url_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// EUREKA SERVER


#///////////////////////////////////////////////////////////////////////////// GENERAL CONFIGURATIONS
volumes:
  postgres-data:

networks:
  linker-network:
    driver: bridge