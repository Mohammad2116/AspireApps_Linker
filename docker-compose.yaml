services:
  #///////////////////////////////////////////////////////////////////////////// POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: Linker_postgres

    environment:
      POSTGRES_USER: demoapps
      POSTGRES_PASSWORD: JingleBells

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demoapps -d linker_url_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// EUREKA SERVER
  eureka-server:
    image: linker/eureka_server
    container_name: linker-eureka-server
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// GENERAL CONFIGURATIONS
volumes:
  postgres-data:

networks:
  linker-network:
    driver: bridge