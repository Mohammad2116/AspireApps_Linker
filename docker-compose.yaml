services:
  #///////////////////////////////////////////////////////////////////////////// POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: Linker_postgres

    environment:
      POSTGRES_USER: demoapps
      POSTGRES_PASSWORD: JingleBells

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demoapps -d linker_url_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// EUREKA SERVER
  eureka-server:
    image: linker/eureka-server
    container_name: linker-eureka-server
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    ports:
      - "8761:8761"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// GATEWAY SERVER

  gateway-server:
    image: linker/gateway-server
    container_name: linker-gateway-server
    build:
      context: ./gateway-server
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: gateway-server
      EUREKA_CLIENT_SERVICE_URL_DEFAUTZONE: http://eureka-server:8761/eureka/

    depends_on:
      eureka-server:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// USER SERVICE
  user-service:
    image: linker/user-service
    container_name: linker-user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    #    Ports should remove to prevent access service directly
    ports:
      - "9000:8080"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// LINKS SERVICE
  links-service:
    image: linker/links-service
    container_name: linker-links-service
    build:
      context: ./links-service
      dockerfile: Dockerfile

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    #    Ports should remove to prevent access service directly
    ports:
      - "9001:8080"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// LINKS SERVICE
  analysis-service:
    image: linker/analysis-service
    container_name: linker-analysis-service
    build:
      context: ./analysis-service
      dockerfile: Dockerfile

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    #    Ports should remove to prevent access service directly
    ports:
      - "9002:8080"

    networks:
      - linker-network

  ############################################################################

  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - linker-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - linker-network

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - linker-network
    restart: "no"
    command: >
      sh -c '
        echo "Waiting for Kafka...";
      
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2;
        done;
      
        echo "Creating Kafka topics...";
      
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic link-visit-topic \
          --partitions 1 \
          --replication-factor 1;
      
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic popularity-response-topic \
          --partitions 1 \
          --replication-factor 1;      

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic link-registered-topic \
          --partitions 1 \
          --replication-factor 1;
      
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic link-deleted-topic \
          --partitions 1 \
          --replication-factor 1;
      
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic analytics-error-topic \
          --partitions 1 \
          --replication-factor 1;      
      
        echo "Kafka topics created.";
      ' 

  ##############################################################################
  redis:
    image: redis:8-alpine
    container_name: redis

    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - myStrongRedisPassword

    ports:
      - 6379
    #      - "6380:6379"
    volumes:
      - redis-data:/data

    networks:
      - linker-network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: [ "CMD",
              "redis-cli",
              "-a",
              "myStrongRedisPassword",
              "ping" ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

#///////////////////////////////////////////////////////////////////////////// GENERAL CONFIGURATIONS
volumes:
  postgres-data:
  kafka-data:
  redis-data:

networks:
  linker-network:
    driver: bridge