services:
  #///////////////////////////////////////////////////////////////////////////// POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: Linker_postgres

    environment:
      POSTGRES_USER: demoapps
      POSTGRES_PASSWORD: JingleBells

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demoapps -d linker_url_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// EUREKA SERVER
  eureka-server:
    image: linker/eureka-server
    container_name: linker-eureka-server
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    ports:
      - "8761:8761"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// GATEWAY SERVER

  gateway-server:
    image: linker/gateway-server
    container_name: linker-gateway-server
    build:
      context: ./gateway-server
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: gateway-server
      EUREKA_CLIENT_SERVICE_URL_DEFAUTZONE: http://eureka-server:8761/eureka/

    depends_on:
      eureka-server:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// USER SERVICE
  user-service:
    image: linker/user-service
    container_name: linker-user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    #    Ports should remove to prevent access service directly
    ports:
      - "9000:8080"

    networks:
      - linker-network

  #///////////////////////////////////////////////////////////////////////////// LINKS SERVICE
  links-service:
    image: linker/links-service
    container_name: linker-links-service
    build:
      context: ./links-service
      dockerfile: Dockerfile

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    #    Ports should remove to prevent access service directly
    ports:
      - "9001:8080"

    networks:
      - linker-network

#///////////////////////////////////////////////////////////////////////////// GENERAL CONFIGURATIONS
volumes:
  postgres-data:

networks:
  linker-network:
    driver: bridge